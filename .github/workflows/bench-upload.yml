name: upload-bench-artifact

on:
  push:
    branches:
      - trunk
  workflow_dispatch:

jobs:
  bench-upload:
    runs-on: ubuntu-latest
    concurrency:
      group: bench-upload-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Run benchmarks
        run: |
          set -euxo pipefail
          cargo xtask bench > result.json

      - name: Wrap results with commit metadata
        run: |
          set -euxo pipefail

          SHA=$(git rev-parse --verify HEAD)
          DATE=$(git show --no-patch --format=%cI "$SHA")
          TITLE=$(git show --no-patch --format=%s "$SHA")
          OUT_FILE="bench--${SHA}.json"

          jq --null-input --compact-output \
            --arg sha "$SHA" \
            --arg date "$DATE" \
            --arg title "$TITLE" \
            --slurpfile result result.json \
            '{
               commit_sha: $sha,
               commit_date: $date,
               commit_title: $title,
               result: $result[0]
             }' > "$OUT_FILE"

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: bench--${{ github.sha }}
          path: bench--${{ github.sha }}.json
          overwrite: true