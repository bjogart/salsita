[workspace]
members = ["xtask", "salsita", "salsita_bench"]
resolver = "3"

[workspace.package]
authors = ["Jasper van den Bogart"]
license = "MIT OR Apache-2.0"
edition = "2024"

[workspace.dependencies]
anyhow = { version = "1.0.104", default-features = false }
salsita = { path = "salsita", default-features = false }
serde = { version = "1.0.229", default-features = false, features = [
  "derive",
  "std",
] }
serde_json = { version = "1.0.154", default-features = false, features = [
  "alloc",
] }
xflags = { version = "0.3.2", default-features = false }
xshell = { version = "0.2.7", default-features = false }

[profile.release]
codegen-units = 1
debug = "line-tables-only"
incremental = true
lto = "fat"
strip = "debuginfo"

[workspace.lints.rust]
absolute-paths-not-starting-with-crate = "warn"
ambiguous-negative-literals = "warn"
closure-returning-async-block = "warn"
deprecated-in-future = "warn"
deprecated-safe = "warn"
deprecated-safe-2024 = "warn"
deref-into-dyn-supertrait = "warn"
edition-2024-expr-fragment-specifier = "allow"
elided-lifetimes-in-paths = "warn"
explicit-outlives-requirements = "warn"
ffi-unwind-calls = "warn"
if-let-rescope = "allow"
impl-trait-overcaptures = "warn"
impl-trait-redundant-captures = "warn"
keyword-idents-2024 = "allow"
let-underscore-drop = "warn"
linker-messages = "warn"
macro-use-extern-crate = "warn"
meta-variable-misuse = "warn"
missing-abi = "warn"
missing-copy-implementations = "warn"
missing-debug-implementations = "warn"
missing-docs = "allow"
missing-unsafe-on-extern = "warn"
non-ascii-idents = "warn"
non-local-definitions = "warn"
redundant-imports = "warn"
redundant-lifetimes = "warn"
rust-2024-guarded-string-incompatible-syntax = "allow"
rust-2024-incompatible-pat = "allow"
rust-2024-prelude-collisions = "allow"
single-use-lifetimes = "warn"
tail-expr-drop-order = "allow"
trivial-casts = "warn"
trivial-numeric-casts = "warn"
unit-bindings = "warn"
unnameable-types = "allow"
unreachable-pub = "warn"
unsafe-attr-outside-unsafe = "warn"
unsafe-code = "warn"
unsafe-op-in-unsafe-fn = "warn"
unstable-features = "warn"
unused-crate-dependencies = "warn"
unused-extern-crates = "warn"
unused-import-braces = "warn"
unused-lifetimes = "warn"
unused-macro-rules = "warn"
unused-qualifications = "allow"
unused-results = "allow"
variant-size-differences = "warn"

[workspace.lints.clippy]
cargo = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
restriction = { level = "warn", priority = -1 }
arithmetic_side_effects = "allow"               # TODO Warn on lint instead.
blanket_clippy_restriction_lints = "allow"
cargo_common_metadata = "allow"
exhaustive_enums = "allow"
exhaustive_structs = "allow"
expect_used = "allow"
field_scoped_visibility_modifiers = "allow"
implicit_return = "allow"
inline_modules = "allow"
items_after_statements = "allow"
min_ident_chars = "allow"
missing_assert_message = "allow"
missing_docs_in_private_items = "allow"
missing_inline_in_public_items = "allow"
missing_panics_doc = "allow"                    # TODO Warn on lint instead.
missing_trait_methods = "allow"
module_name_repetitions = "allow"
panic = "allow"
pattern_type_mismatch = "allow"
pub_with_shorthand = "allow"
question_mark_used = "allow"
redundant_pattern_matching = "allow"
semicolon_if_nothing_returned = "allow"
semicolon_inside_block = "allow"
shadow_reuse = "allow"
single_call_fn = "allow"
unneeded_field_pattern = "allow"

[workspace.lints.rustdoc]
missing_crate_level_docs = "warn"
private_doc_tests = "warn"
unescaped_backticks = "warn"
