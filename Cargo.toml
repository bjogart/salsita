[workspace]
members = ["xtask", "salsita", "salsita_bench"]
resolver = "3"

[workspace.package]
authors = ["Jasper van den Bogart"]
license = "MIT OR Apache-2.0"
edition = "2024"

[workspace.dependencies]
anyhow = { version = "1.0.104", default-features = false }
hashbrown = { version = "0.17.1", default-features = false }
salsita = { path = "salsita", default-features = false }
serde = { version = "1.0.229", default-features = false, features = [
  "derive",
  "std",
] }
serde_json = { version = "1.0.154", default-features = false, features = [
  "alloc",
] }
xflags = { version = "0.3.2", default-features = false }
xshell = { version = "0.2.7", default-features = false }

[profile.release]
codegen-units = 1
debug = "line-tables-only"
incremental = true
lto = "fat"
strip = "debuginfo"

[workspace.lints.rust]
absolute_paths_not_starting_with_crate = "warn"
ambiguous_negative_literals = "warn"
closure_returning_async_block = "warn"
deprecated_in_future = "warn"
deprecated_safe = { level = "warn", priority = -1 }
deref_into_dyn_supertrait = "warn"
edition_2024_expr_fragment_specifier = "allow"
elided_lifetimes_in_paths = "warn"
explicit_outlives_requirements = "warn"
ffi_unwind_calls = "warn"
if_let_rescope = "allow"
impl_trait_overcaptures = "warn"
impl_trait_redundant_captures = "warn"
keyword_idents_2024 = "allow"
let_underscore_drop = "warn"
linker_messages = "warn"
macro_use_extern_crate = "warn"
meta_variable_misuse = "warn"
missing_abi = "warn"
missing_copy_implementations = "warn"
missing_debug_implementations = "warn"
missing_docs = "allow"
missing_unsafe_on_extern = "warn"
non_ascii_idents = "warn"
non_local_definitions = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
rust_2024_guarded_string_incompatible_syntax = "allow"
rust_2024_incompatible_pat = "allow"
rust_2024_prelude_collisions = "allow"
single_use_lifetimes = "warn"
tail_expr_drop_order = "allow"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unit_bindings = "warn"
unnameable_types = "allow"
unreachable_pub = "warn"
unsafe_attr_outside_unsafe = "warn"
unsafe_code = "warn"
unsafe_op_in_unsafe_fn = "warn"
unstable_features = "warn"
unused_crate_dependencies = "warn"
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "allow"
unused_results = "allow"
variant_size_differences = "warn"

[workspace.lints.clippy]
cargo = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
restriction = { level = "warn", priority = -1 }
arithmetic_side_effects = "warn"
blanket_clippy_restriction_lints = "allow"
cargo_common_metadata = "allow"
exhaustive_enums = "allow"
exhaustive_structs = "allow"
expect_used = "allow"
field_scoped_visibility_modifiers = "allow"
implicit_return = "allow"
inline_modules = "allow"
items_after_statements = "allow"
min_ident_chars = "allow"
missing_assert_message = "allow"
missing_docs_in_private_items = "allow"
missing_inline_in_public_items = "allow"
missing_panics_doc = "warn"
missing_trait_methods = "allow"
module_name_repetitions = "allow"
panic = "allow"
pattern_type_mismatch = "allow"
pub_with_shorthand = "allow"
question_mark_used = "allow"
redundant_pattern_matching = "allow"
semicolon_if_nothing_returned = "allow"
semicolon_inside_block = "allow"
shadow_reuse = "allow"
shadow_same = "allow"
single_call_fn = "allow"
unneeded_field_pattern = "allow"

[workspace.lints.rustdoc]
missing_crate_level_docs = "warn"
private_doc_tests = "warn"
unescaped_backticks = "warn"
